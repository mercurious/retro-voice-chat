# Pins every capture node of the SM8250 sound card to S16_LE / 48 kHz / 2 ch.
# The q6 DSP capture path is a bit-exact passthrough whose backend is fixed at that format
# (sm8250_be_hw_params_fixup); PipeWire otherwise negotiates S24 and the capture is garbage: on the
# Flip 2 the 3.5 mm headset mic read as -17.7 dBFS of white noise at S24 and as a clean -67 dBFS floor
# at S16 on the same route (measured 2026-09-29). Playback is untouched.
# Installed by `install.sh --jack-mic` into ~/.config/wireplumber/wireplumber.conf.d/.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input._sys_devices_platform_sound_sound_card0.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]
